appId: dev.marginpdf.reader
productName: Margin PDF
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
  - resources/margin-pdf-icon.png
asar: true
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
fileAssociations:
  - ext: pdf
    name: PDF document
    mimeType: application/pdf
    role: Viewer
win:
  icon: resources/margin-pdf-icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  icon: resources/margin-pdf-icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  target:
    - target: dmg
      arch: [x64, arm64]
linux:
  syncDesktopName: true
  icon: resources/margin-pdf-icon.png
  category: Office
  synopsis: 'Margin PDF: A reader built for papers.'
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: pacman
      arch: [x64]
pacman:
  artifactName: ${name}-${version}-1-x86_64.pkg.tar.zst
  compression: zstd
  fpm:
    - --iteration=1
    # Pacman's PKGINFO requires a single-line description.
    - '--description=Margin PDF: A reader built for papers.'
  # Electron bundles its own codecs; these are its host runtime libraries.
  depends:
    - alsa-lib
    - at-spi2-core
    - cairo
    - dbus
    - expat
    - glib2
    - glibc
    - gtk3
    - libcups
    - libdrm
    - libx11
    - libxcb
    - libxcomposite
    - libxdamage
    - libxext
    - libxfixes
    - libxkbcommon
    - libxrandr
    - mesa
    - nspr
    - nss
    - pango
    - systemd-libs
    - xdg-utils
